# Параметри підключення до БД. Читаються класом DBConnection з classpath.
# H2 у ФАЙЛОВОМУ режимі: дані лежать у ./data/calorie_tracker.mv.db і переживають перезапуск.
#   DB_CLOSE_DELAY=-1 — не закривати БД, поки жива JVM (інакше вона закривається разом з останнім з'єднанням)
db.url=jdbc:h2:file:./data/calorie_tracker;DB_CLOSE_DELAY=-1
db.user=sa
# Для H2 пароль порожній. Для PostgreSQL/MySQL пароль НЕ пишемо сюди, а задаємо змінною
# середовища DB_PASSWORD (або файлом application-local.properties, він у .gitignore).
db.password=
